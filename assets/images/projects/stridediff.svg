<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<title>PN-07 stridediff threat delta pipeline</title>
<desc>Architecture model through STRIDE rules, diff, gate and pull-request comment, with mitigations feeding the gate and three readouts.</desc>
<defs>
<style>.t{font-family:"IBM Plex Mono, SFMono-Regular, Consolas, monospace";letter-spacing:0.06em;fill:#fff}.u{font-size:10px}.s{font-size:9px;fill-opacity:.7}.n{font-size:24px;fill:#36d4be}</style>
<pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
<pattern id="G" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#fff" stroke-opacity=".09"/></pattern>
<marker id="h" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6z" fill="#fff" fill-opacity=".6"/></marker>
<marker id="k" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6z" fill="#36d4be"/></marker>
</defs>
<rect width="640" height="360" fill="#0f1418"/>
<rect width="640" height="360" fill="url(#g)"/>
<rect width="640" height="360" fill="url(#G)"/>
<rect x="0" y="0" width="640" height="30" fill="#fff" fill-opacity=".04"/>
<line x1="0" y1="30" x2="640" y2="30" stroke="#fff" stroke-opacity=".5"/>
<text class="t u" x="16" y="19">PN-07 · STRIDEDIFF · STRIDE THREAT DELTA PER CHANGE</text>
<text class="t s" x="624" y="19" text-anchor="end">FIG 01</text>

