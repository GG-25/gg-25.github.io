<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<title>PN-04 quarry: SQL to Arrow query engine pipeline</title>
<desc>Schematic of the quarry pipeline: SQL text, lexer, parser, binder with catalog, optimizer rules, physical planner, Arrow operators over memory, CSV and Parquet, and query result.</desc>
<defs>
<pattern id="minor" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
<pattern id="major" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#fff" stroke-opacity=".09"/></pattern>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#fff" fill-opacity=".7"/></marker>
<marker id="k" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#36d4be"/></marker>
</defs>
<style>
text{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;font-size:9px;letter-spacing:.06em;fill:#fff;text-transform:uppercase}
.t{fill-opacity:.7}
.k{fill:#36d4be}
.n{font-size:11px}
.bx{fill:#0f1418;stroke:#fff;stroke-opacity:.6;stroke-width:1}
.kb{fill:#0f1418;stroke:#36d4be;stroke-width:1}
.ln{fill:none;stroke:#fff;stroke-opacity:.6;stroke-width:1;marker-end:url(#a)}
.kl{fill:none;stroke:#36d4be;stroke-width:1;marker-end:url(#k)}
.c{text-anchor:middle}
</style>
<rect width="640" height="360" fill="#0f1418"/>
<rect width="640" height="360" fill="url(#minor)"/>
<rect width="640" height="360" fill="url(#major)"/>

<rect x="16" y="16" width="608" height="22" class="bx"/>
<text x="28" y="31">PN-04 · <tspan class="k">QUARRY</tspan> · SQL TO ARROW QUERY ENGINE</text>

