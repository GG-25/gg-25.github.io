<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<title>PN-01 Cold Email Generator schematic</title>
<desc>Flow from a careers page URL through job-listing extraction and a Groq/LangChain LLM step to a Streamlit UI that outputs a personalized cold email.</desc>
<defs>
<pattern id="minor" width="16" height="16" patternUnits="userSpaceOnUse">
<path d="M16 0H0V16" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
</pattern>
<pattern id="major" width="80" height="80" patternUnits="userSpaceOnUse">
<path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>
</pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#36d4be"/>
</marker>
</defs>
<rect x="0" y="0" width="640" height="360" fill="#0f1418"/>
<rect x="0" y="0" width="640" height="360" fill="url(#minor)"/>
<rect x="0" y="0" width="640" height="360" fill="url(#major)"/>
<g font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" fill="#ffffff" letter-spacing="0.06em">
<rect x="16" y="16" width="608" height="24" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
<text x="26" y="32" font-size="10">PN-01 · COLD EMAIL GENERATOR · CAREERS URL TO PERSONALIZED OUTREACH</text>

<text x="52" y="118" font-size="9" fill-opacity="0.7">01 · INPUT</text>
<text x="192" y="118" font-size="9" fill-opacity="0.7">02 · EXTRACT</text>
<text x="332" y="118" font-size="9" fill-opacity="0.7">03 · GENERATE</text>
<text x="472" y="118" font-size="9" fill-opacity="0.7">04 · PRESENT</text>

<rect x="52" y="130" width="116" height="70" fill="#0f1418" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
<text x="110" y="156" font-size="10" text-anchor="middle">CAREERS URL</text>
<text x="110" y="174" font-size="9" text-anchor="middle" fill-opacity="0.7">company page</text>

<rect x="192" y="130" width="116" height="70" fill="#0f1418" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
<text x="250" y="156" font-size="10" text-anchor="middle">JOB EXTRACTION</text>
<text x="250" y="174" font-size="9" text-anchor="middle" fill-opacity="0.7">listings to text</text>

<rect x="332" y="130" width="116" height="70" fill="#0f1418" stroke="#36d4be" stroke-opacity="0.8" stroke-width="1"/>
<text x="390" y="156" font-size="10" text-anchor="middle">LLM STEP</text>
<text x="390" y="174" font-size="9" text-anchor="middle" fill-opacity="0.7">Groq · LangChain</text>

<rect x="472" y="130" width="116" height="70" fill="#0f1418" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
<text x="530" y="156" font-size="10" text-anchor="middle">STREAMLIT UI</text>
<text x="530" y="174" font-size="9" text-anchor="middle" fill-opacity="0.7">cold email out</text>

<line x1="170" y1="165" x2="190" y2="165" stroke="#36d4be" stroke-width="1" marker-end="url(#ah)"/>
<line x1="310" y1="165" x2="330" y2="165" stroke="#36d4be" stroke-width="1" marker-end="url(#ah)"/>
<line x1="450" y1="165" x2="470" y2="165" stroke="#36d4be" stroke-width="1" marker-end="url(#ah)"/>

<line x1="52" y1="226" x2="588" y2="226" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
<line x1="52" y1="221" x2="52" y2="231" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
<line x1="588" y1="221" x2="588" y2="231" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
<text x="320" y="242" font-size="9" text-anchor="middle" fill-opacity="0.7">BDE OUTREACH PIPELINE · STARCOM</text>

<rect x="52" y="262" width="130" height="40" fill="none" stroke="#36d4be" stroke-width="1"/>
<text x="117" y="287" font-size="11" text-anchor="middle" fill="#36d4be">4 STAGES</text>
<text x="200" y="280" font-size="9" fill-opacity="0.7">SOURCE: CAREERS PAGE</text>
<text x="200" y="294" font-size="9" fill-opacity="0.7">OUTPUT: PERSONALIZED EMAIL</text>

<rect x="16" y="320" width="608" height="24" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
<text x="26" y="336" font-size="9" fill-opacity="0.6">SCHEMATIC · NOT TO SCALE</text>
</g>
</svg>