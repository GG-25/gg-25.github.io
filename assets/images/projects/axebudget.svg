<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <title>PN-05 axebudget schematic</title>
  <desc>Scanner feeds evaluate() and freezeBaseline(). A baseline ledger and per-component budgets produce a GateResult, which renders to the CI report. Readouts: 12 seeded violations, 15 tests.</desc>
  <defs>
    <style>
      text{font-family:"IBM Plex Mono, SFMono-Regular, Consolas, monospace";letter-spacing:.06em;fill:#ffffff;font-size:11px}
      .s{font-size:9px;fill-opacity:.7;text-transform:uppercase}
      .t{font-size:10px}
      .a{fill:#36d4be}
      .box{fill:#0f1418;stroke:#ffffff;stroke-opacity:.6;stroke-width:1}
      .key{stroke:#36d4be;stroke-width:1.2}
      .ln{fill:none;stroke:#ffffff;stroke-opacity:.6;stroke-width:1}
      .kbox{stroke:#36d4be;stroke-opacity:1}
    </style>
    <pattern id="minor" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#ffffff" fill-opacity="0.6"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#36d4be"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="360" fill="#0f1418"/>
  <rect x="0" y="0" width="640" height="360" fill="url(#minor)"/>
  <rect x="0" y="0" width="640" height="360" fill="url(#major)"/>

  <!-- title strip -->
  <rect x="16" y="16" width="608" height="24" class="ln"/>
  <text x="28" y="32" class="t">PN-05 · AXEBUDGET · ACCESSIBILITY REGRESSION GATE</text>

  <!-- arrows (drawn first so boxes sit on top) -->
  <line x1="182" y1="124" x2="240" y2="124" class="key" marker-end="url(#ak)"/>
  <line x1="448" y1="124" x2="390" y2="124" class="ln" marker-end="url(#ah)"/>
  <line x1="107" y1="152" x2="107" y2="200" class="ln" marker-end="url(#ah)"/>
  <line x1="182" y1="225" x2="240" y2="225" class="ln" marker-end="url(#ah)"/>
  <line x1="315" y1="200" x2="315" y2="152" class="ln" marker-end="url(#ah)"/>
  <polyline points="390,140 420,140 420,225 448,225" class="key" fill="none" marker-end="url(#ak)"/>
  <line x1="528" y1="250" x2="528" y2="280" class="key" marker-end="url(#ak)"/>
  <line x1="315" y1="250" x2="315" y2="280" class="ln" marker-end="url(#ah)"/>

  <!-- top row -->
  <rect x="32" y="96" width="150" height="56" class="box"/>
  <text x="107" y="118" text-anchor="middle" class="s">Scanner</text>
  <text x="107" y="136" text-anchor="middle">FixtureScanner</text>

  <rect x="240" y="96" width="150" height="56" class="box kbox"/>
  <text x="315" y="118" text-anchor="middle" class="s a">Gate</text>
  <text x="315" y="136" text-anchor="middle">evaluate()</text>

  <rect x="448" y="96" width="160" height="56" class="box"/>
  <text x="528" y="118" text-anchor="middle" class="s">Budgets</text>
  <text x="528" y="136" text-anchor="middle">per component</text>

  <!-- middle row -->
  <rect x="32" y="200" width="150" height="50" class="box"/>
  <text x="107" y="220" text-anchor="middle" class="s">Action</text>
  <text x="107" y="238" text-anchor="middle">freezeBaseline()</text>

  <rect x="240" y="200" width="150" height="50" class="box"/>
  <text x="315" y="220" text-anchor="middle" class="s">Debt store</text>
  <text x="315" y="238" text-anchor="middle">owner · expiresAt</text>

  <rect x="448" y="200" width="160" height="50" class="box kbox"/>
  <text x="528" y="220" text-anchor="middle" class="s a">Result</text>
  <text x="528" y="238" text-anchor="middle">GateResult</text>

  <!-- bottom row -->
  <rect x="32" y="280" width="150" height="48" class="box"/>
  <text x="107" y="298" text-anchor="middle" class="a">12 VIOLATIONS</text>
  <text x="107" y="316" text-anchor="middle" class="a">15 TESTS</text>

  <rect x="240" y="280" width="150" height="48" class="box"/>
  <text x="315" y="300" text-anchor="middle" class="s">Burndown</text>
  <text x="315" y="316" text-anchor="middle">pruneFixed()</text>

  <rect x="448" y="280" width="160" height="48" class="box kbox"/>
  <text x="528" y="300" text-anchor="middle" class="s a">Output</text>
  <text x="528" y="316" text-anchor="middle">renderGate()</text>
</svg>