<text class="t u" x="76" y="298">TESTS</text>
<text class="t s" x="76" y="312">npm test</text>

<rect x="224" y="274" width="192" height="56" fill="#0f1418" stroke="#fff" stroke-opacity=".6"/>
<text class="t n" x="238" y="316">8</text>
<text class="t u" x="284" y="298">MUTATIONS</text>
<text class="t s" x="284" y="312">in the demo table</text>

<rect x="432" y="274" width="192" height="56" fill="#0f1418" stroke="#fff" stroke-opacity=".6"/>
<text class="t n" x="446" y="316">3</text>
<text class="t u" x="492" y="298">NEW THREATS</text>
