<rect x="524" y="200" width="100" height="52" fill="#0f1418" stroke="#fff" stroke-opacity=".6"/>
<text class="t u" x="534" y="218">MERMAID</text>
<text class="t s" x="534" y="234">BOUNDARY MARKS</text>
<line x1="574" y1="148" x2="574" y2="198" stroke="#fff" stroke-opacity=".6" marker-end="url(#h)"/>

<line x1="66" y1="148" x2="66" y2="182" stroke="#fff" stroke-opacity=".6" marker-end="url(#h)"/>
<rect x="16" y="184" width="220" height="64" fill="none" stroke="#fff" stroke-opacity=".5" stroke-dasharray="4 3"/>
<text class="t s" x="24" y="198">TRUST BOUNDARY · INTERNET</text>
<rect x="28" y="206" width="80" height="30" fill="#0f1418" stroke="#fff" stroke-opacity=".6"/>
