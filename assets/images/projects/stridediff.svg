<text class="t u" x="26" y="118">MODEL</text>
<text class="t s" x="26" y="134">ZONES · FLOWS</text>
<rect x="143" y="96" width="100" height="52" fill="#0f1418" stroke="#fff" stroke-opacity=".6"/>
<text class="t u" x="153" y="118">STRIDE</text>
<text class="t s" x="153" y="134">THREATSFORFLOW</text>
<rect x="270" y="96" width="100" height="52" fill="#0f1418" stroke="#fff" stroke-opacity=".6"/>
<text class="t u" x="280" y="118">DIFF</text>
<text class="t s" x="280" y="134">BASE VS HEAD</text>
<rect x="397" y="96" width="100" height="52" fill="#0f1418" stroke="#36d4be"/>
