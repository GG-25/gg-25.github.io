<text class="t s" x="407" y="134">NEW RISK CHECK</text>
<rect x="524" y="96" width="100" height="52" fill="#0f1418" stroke="#fff" stroke-opacity=".6"/>
<text class="t u" x="534" y="118">RENDER</text>
<text class="t s" x="534" y="134">PR COMMENT</text>

<line x1="116" y1="122" x2="142" y2="122" stroke="#fff" stroke-opacity=".6" marker-end="url(#h)"/>
<line x1="243" y1="122" x2="269" y2="122" stroke="#fff" stroke-opacity=".6" marker-end="url(#h)"/>
<line x1="370" y1="122" x2="396" y2="122" stroke="#36d4be" marker-end="url(#k)"/>
<line x1="497" y1="122" x2="523" y2="122" stroke="#36d4be" marker-end="url(#k)"/>

<rect x="397" y="200" width="100" height="52" fill="#0f1418" stroke="#fff" stroke-opacity=".6"/>
<text class="t u" x="407" y="218">MITIGATIONS</text>
<text class="t s" x="407" y="234">CONTROL/OWNER</text>
